name: CodeQL SAST

# Static Application Security Testing (SAST) for mRemoteNF.
#
# Unlike the dependency scan (which only inspects third-party components),
# CodeQL analyses the project's own C# source for security weaknesses such as
# injection, insecure deserialization, path traversal, hard-coded secrets and
# unsafe cryptography. Results appear under Security -> Code scanning.
#
# NOTE: Uploading results requires GitHub code scanning (Advanced Security).
# On repositories where it is not enabled the analyze step is tolerated so the
# workflow does not fail.

on:
  push:
    branches:
      - v1.78.2-dev
  pull_request:
    branches:
      - v1.78.2-dev
  schedule:
    # Weekly, Monday 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # security-and-quality adds maintainability queries on top of the
          # default security query suite.
          queries: security-and-quality
          # build-mode "none" analyses the C# source directly, without a build.
          # This avoids needing Visual Studio 2026 (v18.0 T4 targets), msbuild
          # and the T4 transform on the runner - none of which are required for
          # source-level SAST.
          build-mode: none

      - name: Perform CodeQL Analysis
        # Tolerate repositories without code scanning (Advanced Security).
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
